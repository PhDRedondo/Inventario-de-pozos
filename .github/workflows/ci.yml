name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Typecheck
        run: npx tsc --noEmit
