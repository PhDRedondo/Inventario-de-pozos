<header class="app-header">
  <div class="inner">
    <span class="brand">VIP</span>
    <span class="tagline">Validador del Inventario de Pozos · ANH (GOP)</span>
    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Cuadernos</a>
      <a routerLink="/panel" routerLinkActive="active">Panel</a>
      <a routerLink="/analitica" routerLinkActive="active">Analítica</a>
      <a routerLink="/flujo" routerLinkActive="active">Flujo</a>
      <a routerLink="/mapa" routerLinkActive="active">Mapa</a>
    </nav>
    <div class="session" *ngIf="authEnabled">
      <span class="user" *ngIf="username">{{ username }}</span>
      <button type="button" class="auth-btn" *ngIf="!username" (click)="login()">Ingresar</button>
      <button type="button" class="auth-btn" *ngIf="username" (click)="logout()">Salir</button>
    </div>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>
