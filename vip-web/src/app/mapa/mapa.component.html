<h2 class="page-title">Mapa territorial</h2>
<p class="hint">Un punto por pozo aplicado, coloreado por validación, sobre los departamentos de Colombia.</p>

<div class="alert error" *ngIf="error">{{ error }}</div>

<div #map class="map"></div>

<div class="legend">
  <span><i class="sw" style="background:#1b7f4a"></i> Válido</span>
  <span><i class="sw" style="background:#ff8c00"></i> Advertencia</span>
  <span><i class="sw" style="background:#b42318"></i> Inválido</span>
  <span class="count">{{ count }} pozo(s) georreferenciado(s)</span>
</div>
